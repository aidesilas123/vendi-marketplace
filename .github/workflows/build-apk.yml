# .github/workflows/build-apk.yml
name: Build Android APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web App
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
        run: |
          npm install
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # A stable debug keystore committed to the repo (android/app/debug.keystore),
      # so every CI build signs with the SAME key no matter which runner or image
      # runs the job. Installed here before the build; Gradle's default debug
      # signing picks it up from ~/.android/debug.keystore automatically, so no
      # build.gradle change is needed. Safe to commit: the debug keystore uses the
      # publicly-known android/android credentials and can never publish to Play.
      - name: Install Stable Debug Keystore
        run: |
          mkdir -p ~/.android
          cp android/app/debug.keystore ~/.android/debug.keystore

      # Prints the SHA-1 of the debug key that signs the APK, for the
      # Google Cloud Console API-key restriction. Read it from this step's log.
      # Stable across builds because the keystore above is committed to the repo.
      - name: Print Debug Signing SHA-1
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA-1\|SHA1"

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/vendi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendi-debug
          path: android/app/build/outputs/apk/debug/vendi.apk
