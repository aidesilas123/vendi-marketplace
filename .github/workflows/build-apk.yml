# .github/workflows/build-apk.yml
name: Build Android APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web App
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          npm install
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # A stable debug keystore committed to the repo (android/app/debug.keystore),
      # so every CI build signs with the SAME key no matter which runner or image
      # runs the job. Installed here before the build for the Print cross-check;
      # the actual signing key is forced by signingConfigs.debug in
      # android/app/build.gradle, which points at this same file. Safe to commit:
      # the debug keystore uses the publicly-known android/android credentials
      # and can never publish to Play.
      - name: Install Stable Debug Keystore
        run: |
          mkdir -p ~/.android
          cp android/app/debug.keystore ~/.android/debug.keystore

      # Prints the SHA-1 of the debug key that signs the APK, for the
      # Google Cloud Console API-key restriction. Read it from this step's log.
      # Stable across builds because the keystore above is committed to the repo.
      - name: Print Debug Signing SHA-1
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA-1\|SHA1"

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/vendi.apk

      # Prints the APK file's own signer certificates (not the keystore's).
      # If this ever differs from the Print Debug Signing SHA-1 step above,
      # the build signed with a different key than the repo keystore — read
      # this before trusting anything else about the artifact.
      # Uses apksigner, not keytool: keytool only reads JAR (v1) signatures
      # and its output labels didn't match the grep, which failed the run
      # (grep exits 1 on no match, and the step runs under bash -e).
      # apksigner understands v1+v2+v3 signatures and prints the SHA-1
      # digest directly. Non-blocking: a diagnostic step must never stop
      # the artifact upload again.
      - name: Print APK Signing SHA-1
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/vendi.apk || echo "apksigner could not verify the APK"
          else
            keytool -printcert -jarfile android/app/build/outputs/apk/debug/vendi.apk || echo "keytool could not read the APK signature"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendi-debug
          path: android/app/build/outputs/apk/debug/vendi.apk
